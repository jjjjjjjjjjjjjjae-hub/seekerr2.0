name: Build Spy APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Кодты алу
        uses: actions/checkout@v3

      - name: Buildozer-мен APK жинау
        uses: ArtemSerebrennikov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: master

      - name: Дайын APK-ны сақтау (Upload Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: Seeker-APK
          path: bin/*.apk
