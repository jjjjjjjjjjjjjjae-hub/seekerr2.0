name: Seeker 2.0 Factory Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Кодты тексеру (Checkout)
      uses: actions/checkout@v3

    - name: Python ортасын орнату
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Кітапханаларды орнату
      run: |
        python -m pip install --upgrade pip
        pip install pyTelegramBotAPI requests

    - name: Скрипттің синтаксисін тексеру
      run: |
        # Бұл жерде зауыт кодтың қатесіз жазылғанын тексереді
        python -m py_compile seeker.py

    - name: Зауыт есебі
      run: echo "Seeker 2.0 сәтті тексерілді және жиналды!"
